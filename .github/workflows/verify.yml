name: Pi and core verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_wsl:
        description: Run the same suite on the registered WSL2 runner
        type: boolean
        default: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test
  wsl:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_wsl
    runs-on: [self-hosted, linux, wsl2]
    steps:
      - uses: actions/checkout@v4
      - name: Verify the runner is WSL2
        run: grep -Eiq 'microsoft.*wsl2' /proc/sys/kernel/osrelease
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm run test
